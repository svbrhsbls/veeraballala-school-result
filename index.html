<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಾಲಾ ಫಲಿತಾಂಶ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">ಕರ್ನಾಟಕ ಶಾಲಾ ಫಲಿತಾಂಶ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</span>
        </div>
    </nav>

    <!-- Dashboard Counters -->
    <div class="container my-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3 p-3">
                    <h5>ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು</h5>
                    <h2 id="totalStudents">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info mb-3 p-3">
                    <h5>ಗಂಡು ಮಕ್ಕಳು</h5>
                    <h2 id="maleCount">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3 p-3">
                    <h5>ಹೆಣ್ಣು ಮಕ್ಕಳು</h5>
                    <h2 id="femaleCount">0</h2>
                </div>
            </div>
        </div>

        <!-- Student Form -->
        <div class="card p-3 shadow-sm mb-4">
            <h4>ಹೊಸ ವಿದ್ಯಾರ್ಥಿ ನೋಂದಣಿ</h4>
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="stdName" class="form-control" placeholder="ವಿದ್ಯಾರ್ಥಿ ಹೆಸರು">
                </div>
                <div class="col-md-4">
                    <select id="stdGender" class="form-select">
                        <option value="Male">ಗಂಡು (Male)</option>
                        <option value="Female">ಹೆಣ್ಣು (Female)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100" onclick="addStudent()">ಸೇರಿಸಿ (Add)</button>
                </div>
            </div>
        </div>

        <!-- Student Table -->
        <div class="card p-3 shadow-sm">
            <h4>ವಿದ್ಯಾರ್ಥಿಗಳ ಪಟ್ಟಿ</h4>
            <table class="table table-bordered table-striped mt-2">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>ಹೆಸರು</th>
                        <th>ಲಿಂಗ</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        let students = JSON.parse(localStorage.getItem('students')) || [];

        function renderData() {
            const tableBody = document.getElementById('studentTableBody');
            tableBody.innerHTML = '';
            let male = 0, female = 0;

            students.forEach((s, index) => {
                if (s.gender === 'Male') male++;
                if (s.gender === 'Female') female++;

                tableBody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${s.name}</td>
                        <td>${s.gender}</td>
                    </tr>`;
            });

            document.getElementById('totalStudents').innerText = students.length;
            document.getElementById('maleCount').innerText = male;
            document.getElementById('femaleCount').innerText = female;
        }

        function addStudent() {
            const name = document.getElementById('stdName').value;
            const gender = document.getElementById('stdGender').value;

            if (name.trim() === '') {
                alert('ಹೆಸರನ್ನು ನಮೂದಿಸಿ!');
                return;
            }

            students.push({ name, gender });
            localStorage.setItem('students', JSON.stringify(students));
            document.getElementById('stdName').value = '';
            renderData();
        }

        // ಪುಟ ಲೋಡ್ ಆದಾಗ ಡೇಟಾ ತರಲು
        renderData();
    </script>
</body>
</html>
